<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – Banjare</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
</head>
<body class="auth-page">

<!-- Navbar -->
<nav class="navbar banjare-nav fixed-top">
  <div class="container">
    <a class="navbar-brand" href="../index.html">
      <span class="brand-icon">🏔️</span>
      <span class="brand-text">Banjare</span>
    </a>
  </div>
</nav>

<div class="container">
  <div class="auth-card">
    <div class="auth-logo">
      <span style="font-size:3rem">🏔️</span>
      <h2 class="mt-2">Welcome Back!</h2>
      <p class="text-muted">Login to your Banjare account</p>
    </div>

    <!-- Alert -->
    <div id="loginAlert" class="alert d-none" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
          <input type="email" class="form-control" id="loginEmail" placeholder="you@example.com" required/>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
          <input type="password" class="form-control" id="loginPassword" placeholder="Enter password" required/>
          <button class="btn btn-outline-secondary" type="button" id="togglePwd">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe"/>
          <label class="form-check-label text-muted small" for="rememberMe">Remember me</label>
        </div>
        <a href="forgot-password.html" class="text-success small fw-bold">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-banjare-primary w-100 py-3" id="loginBtn">
        <span id="loginBtnText"><i class="fas fa-sign-in-alt me-2"></i>Login</span>
        <span id="loginSpinner" class="d-none"><div class="spinner-border spinner-border-sm me-2"></div>Logging in...</span>
      </button>
    </form>

    <hr class="my-4"/>
    <p class="text-center text-muted mb-0">
      Don't have an account?
      <a href="register.html" class="text-success fw-bold">Create one free</a>
    </p>
    <p class="text-center text-muted small mt-2">
      Want to list your vehicle?
      <a href="register.html?role=owner" class="text-success fw-bold">Register as Owner →</a>
    </p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script>
  // Redirect if already logged in
  if (isLoggedIn()) {
    const user = getUser();
    window.location.href = user?.role === 'admin' ? 'admin-dashboard.html' : user?.role === 'owner' ? 'owner-dashboard.html' : 'dashboard.html';
  }

  // Toggle password visibility
  document.getElementById('togglePwd')?.addEventListener('click', () => {
    const inp = document.getElementById('loginPassword');
    const icon = document.querySelector('#togglePwd i');
    if (inp.type === 'password') { inp.type = 'text'; icon.classList.replace('fa-eye','fa-eye-slash'); }
    else { inp.type = 'password'; icon.classList.replace('fa-eye-slash','fa-eye'); }
  });

  // Login form submit
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const alert    = document.getElementById('loginAlert');
    const btnText  = document.getElementById('loginBtnText');
    const spinner  = document.getElementById('loginSpinner');

    alert.className = 'alert d-none';
    btnText.classList.add('d-none');
    spinner.classList.remove('d-none');

    try {
      const res = await AuthAPI.login({ email, password });
      setAuth(res.token, res.user);
      showToast('Login successful! Redirecting...', 'success');

      // Check for redirect param
      const params   = new URLSearchParams(window.location.search);
      const redirect = params.get('redirect');
      if (redirect) { window.location.href = redirect; return; }

      // Role-based redirect
      const dest = res.user.role === 'admin' ? 'admin-dashboard.html' : res.user.role === 'owner' ? 'owner-dashboard.html' : 'dashboard.html';
      setTimeout(() => window.location.href = dest, 600);
    } catch (err) {
      alert.className = 'alert alert-danger';
      alert.textContent = err.message || 'Login failed. Please try again.';
      btnText.classList.remove('d-none');
      spinner.classList.add('d-none');
    }
  });

  // Show expired session message
  if (new URLSearchParams(window.location.search).get('expired')) {
    const alert = document.getElementById('loginAlert');
    alert.className = 'alert alert-warning';
    alert.textContent = 'Your session has expired. Please login again.';
  }
</script>
</body>
</html>
