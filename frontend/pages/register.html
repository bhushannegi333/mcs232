<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register – Banjare</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <style>
    .role-card { border: 2px solid #e9ecef; border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.2s; text-align: center; }
    .role-card:hover { border-color: var(--green-mid); background: var(--green-pale); }
    .role-card.selected { border-color: var(--green-dark); background: var(--green-pale); }
    .role-card .role-icon { font-size: 2rem; margin-bottom: 6px; }
    .role-card h6 { font-weight: 800; margin: 0; font-size: 0.9rem; }
    .role-card small { color: var(--text-muted); font-size: 0.78rem; }
    .password-strength { height: 4px; border-radius: 2px; margin-top: 6px; transition: all 0.3s; }
  </style>
</head>
<body class="auth-page">

<nav class="navbar banjare-nav fixed-top">
  <div class="container">
    <a class="navbar-brand" href="../index.html">
      <span class="brand-icon">🏔️</span><span class="brand-text">Banjare</span>
    </a>
  </div>
</nav>

<div class="container" style="max-width:560px;">
  <div class="auth-card">
    <div class="auth-logo">
      <span style="font-size:3rem">🏔️</span>
      <h2 class="mt-2">Create Account</h2>
      <p class="text-muted">Join Banjare and explore Uttarakhand</p>
    </div>

    <!-- Role selector -->
    <div class="mb-4">
      <label class="form-label fw-bold">I want to:</label>
      <div class="row g-2">
        <div class="col-6">
          <div class="role-card selected" id="roleUser" onclick="selectRole('user')">
            <div class="role-icon">🧳</div>
            <h6>Book a Trip</h6>
            <small>As a Traveler</small>
          </div>
        </div>
        <div class="col-6">
          <div class="role-card" id="roleOwner" onclick="selectRole('owner')">
            <div class="role-icon">🚗</div>
            <h6>List My Vehicle</h6>
            <small>As an Owner</small>
          </div>
        </div>
      </div>
      <input type="hidden" id="selectedRole" value="user"/>
    </div>

    <div id="registerAlert" class="alert d-none" role="alert"></div>

    <form id="registerForm" novalidate>
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-user text-muted"></i></span>
          <input type="text" class="form-control" id="regName" placeholder="Bharatbhushan Negi" required minlength="2"/>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
          <input type="email" class="form-control" id="regEmail" placeholder="you@example.com" required/>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Mobile Number</label>
        <div class="input-group">
          <span class="input-group-text">+91</span>
          <input type="tel" class="form-control" id="regPhone" placeholder="9557166769" pattern="[6-9][0-9]{9}" maxlength="10"/>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
          <input type="password" class="form-control" id="regPassword" placeholder="Min. 6 characters" required minlength="6" oninput="checkStrength(this.value)"/>
          <button class="btn btn-outline-secondary" type="button" onclick="togglePwd('regPassword',this)"><i class="fas fa-eye"></i></button>
        </div>
        <div class="password-strength" id="strengthBar" style="background:#e9ecef;width:0%"></div>
        <small id="strengthText" class="text-muted"></small>
      </div>
      <div class="mb-4">
        <label class="form-label">Confirm Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
          <input type="password" class="form-control" id="regConfirm" placeholder="Re-enter password" required/>
        </div>
      </div>
      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="agreeTerms" required/>
        <label class="form-check-label text-muted small" for="agreeTerms">
          I agree to the <a href="#" class="text-success">Terms of Service</a> and <a href="#" class="text-success">Privacy Policy</a>
        </label>
      </div>
      <button type="submit" class="btn btn-banjare-primary w-100 py-3" id="regBtn">
        <span id="regBtnText"><i class="fas fa-user-plus me-2"></i>Create Account</span>
        <span id="regSpinner" class="d-none"><div class="spinner-border spinner-border-sm me-2"></div>Creating...</span>
      </button>
    </form>
    <hr class="my-4"/>
    <p class="text-center text-muted mb-0">
      Already have an account? <a href="login.html" class="text-success fw-bold">Login →</a>
    </p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script>
  if (isLoggedIn()) window.location.href = 'dashboard.html';

  // Pre-select role from URL param
  const urlRole = new URLSearchParams(window.location.search).get('role');
  if (urlRole === 'owner') selectRole('owner');

  function selectRole(role) {
    document.getElementById('selectedRole').value = role;
    document.getElementById('roleUser').classList.toggle('selected', role === 'user');
    document.getElementById('roleOwner').classList.toggle('selected', role === 'owner');
  }

  function togglePwd(id, btn) {
    const inp = document.getElementById(id);
    const icon = btn.querySelector('i');
    if (inp.type === 'password') { inp.type = 'text'; icon.classList.replace('fa-eye','fa-eye-slash'); }
    else { inp.type = 'password'; icon.classList.replace('fa-eye-slash','fa-eye'); }
  }

  function checkStrength(val) {
    const bar  = document.getElementById('strengthBar');
    const text = document.getElementById('strengthText');
    let score = 0, msg = '', color = '#e9ecef';
    if (val.length >= 6)  score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^a-zA-Z0-9]/.test(val)) score++;
    if      (score <= 1) { msg = 'Weak'; color = '#e63946'; }
    else if (score <= 3) { msg = 'Moderate'; color = '#f4a261'; }
    else                 { msg = 'Strong 💪'; color = '#2d6a4f'; }
    bar.style.width = (score * 20) + '%';
    bar.style.background = color;
    text.textContent = val ? msg : '';
    text.style.color = color;
  }

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name     = document.getElementById('regName').value.trim();
    const email    = document.getElementById('regEmail').value.trim();
    const phone    = document.getElementById('regPhone').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirm  = document.getElementById('regConfirm').value;
    const role     = document.getElementById('selectedRole').value;
    const terms    = document.getElementById('agreeTerms').checked;
    const alertEl  = document.getElementById('registerAlert');

    if (!terms) { alertEl.className='alert alert-warning'; alertEl.textContent='Please accept Terms of Service.'; return; }
    if (password !== confirm) { alertEl.className='alert alert-danger'; alertEl.textContent='Passwords do not match.'; return; }

    alertEl.className = 'alert d-none';
    document.getElementById('regBtnText').classList.add('d-none');
    document.getElementById('regSpinner').classList.remove('d-none');

    try {
      const res = await AuthAPI.register({ name, email, phone, password, role });
      setAuth(res.token, res.user);
      showToast('Account created! Welcome to Banjare 🎉', 'success');
      setTimeout(() => {
        window.location.href = role === 'owner' ? 'owner-dashboard.html' : 'dashboard.html';
      }, 700);
    } catch (err) {
      alertEl.className = 'alert alert-danger';
      alertEl.textContent = err.message || 'Registration failed.';
      document.getElementById('regBtnText').classList.remove('d-none');
      document.getElementById('regSpinner').classList.add('d-none');
    }
  });
</script>
</body>
</html>
